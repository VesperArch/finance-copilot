{% if form.errors %}
<div class="error-summary" role="alert"><strong>Revise os campos abaixo.</strong>{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="field {% if field.errors %}invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-label="obrigatório"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
</div>
{% endfor %}
